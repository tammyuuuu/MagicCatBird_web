<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>八字排盘 Beta｜天工阁</title><style>
:root{--bg:#07110f;--panel:#0e1d19;--line:#304b40;--ink:#e7dfc9;--muted:#93a99f;--gold:#d2b878;--red:#d67868}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#18362d,#07110f 52%);color:var(--ink);font:14px/1.6 "Noto Serif SC","Songti SC",serif}a{color:var(--gold)}header{padding:22px 4vw 12px;display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line)}h1{margin:3px 0;font-size:25px}header p,.subnav{margin:0;color:var(--muted)}.badge,mark{color:#201b10;background:var(--gold);padding:3px 8px;border-radius:20px}.layout{display:grid;grid-template-columns:300px 1fr;gap:18px;padding:18px 4vw 50px}.panel{background:#0d1b18e8;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 16px 38px #0005}form{position:sticky;top:14px}label{display:block;margin:10px 0;color:var(--muted)}input,select,button{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:#07120f;color:var(--ink);font:inherit}button{margin-top:16px;background:#9e864e;color:#090d0b;font-weight:bold}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}.error,.bad{color:var(--red)}h2{font-size:17px;color:var(--gold);margin:22px 0 9px}.time-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.time-grid div,.compare div{padding:8px;background:#071310;border-radius:6px}.time-grid b,.compare b{display:block;color:var(--muted);font-size:11px}table{border-collapse:collapse;width:100%;text-align:center}th,td{border:1px solid var(--line);padding:9px 5px}th{color:var(--muted)}strong.stem,strong.branch{display:block;font-size:28px;color:var(--gold)}small{display:block;color:var(--muted);font-size:10px}em{color:var(--gold)}.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}.compare p{grid-column:1/-1;margin:0}.good{color:#83c6a6}.luck-row{display:flex;gap:8px;overflow:auto}.luck-row div{min-width:110px;text-align:center;padding:10px;background:#071310;border:1px solid var(--line);border-radius:7px}.luck-row strong{display:block;font-size:20px;color:var(--gold)}details{border-top:1px solid var(--line);padding:8px}summary{cursor:pointer;color:var(--gold)}pre{white-space:pre-wrap;font:11px/1.4 monospace;color:#aec0b8}nav{display:flex;gap:12px}@media(max-width:800px){.layout{grid-template-columns:1fr}form{position:static}.time-grid,.compare{grid-template-columns:1fr}.chart-wrap{overflow:auto}table{min-width:620px}header{align-items:start;gap:10px;flex-direction:column}}
</style></head><body><header><div><nav><a href="baigong_web.html">天工阁</a><span>›</span><b>术数</b><span>›</span><b>八字排盘</b></nav><h1>四柱排盘验盘台</h1><p>术数门主要功能 · 其他功能待开发</p><div class="subnav">排盘（当前）　｜　命例（待开发）　｜　卦例（待开发）　｜　术理（待开发）</div></div><span class="badge" id="status">Beta</span></header><main class="layout"><aside><form class="panel" id="form"><label>性别<select name="gender"><option value="female">女</option><option value="male">男</option></select></label><label>公历日期<input name="date" type="date" value="1995-08-12" required></label><label>出生时间<input name="time" type="time" value="14:30" step="60" required></label><label>出生地点<input name="place" value="上海" required></label><label>时区 ID<input name="timezoneId" value="Asia/Shanghai" required></label><label>经度<input name="longitude" type="number" step="0.0001" value="121.4737" required></label><label>纬度<input name="latitude" type="number" step="0.0001" value="31.2304" required></label><label>换日规则<select name="dayBoundaryRule"><option value="midnight">00:00 换日</option><option value="zi_hour">23:00 子初换日</option></select></label><label class="check"><input name="trueSolarTime" type="checkbox">采用真太阳时</label><button>生成／重新排盘</button><p class="error" id="error"></p></form></aside><section class="panel"><h2>输入与时间换算</h2><div class="time-grid" id="timeSummary"></div><h2>四柱主盘</h2><div class="chart-wrap"><table id="chart"></table></div><h2>参考排盘对比</h2><div class="compare" id="compare"></div><h2>大运</h2><div id="luck"></div><h2>验盘 / Debug 模式</h2><div id="debug"></div></section></main><script src="bazi_app.js"></script></body></html>
