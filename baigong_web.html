var DATA={talisman:{title:'符 箓',note:'由识形、备纸、次序到收卷，先读制式，再近案练习。',entries:[E('平安笺样','符式练习 · 基础','以界格、次序与收笔为重点的入门笺样。第一版只呈现书写秩序，不声称现实功效。','先正纸位，再循上而下；心手安定，重于繁复形制。',[['朱砂色墨','练习用水性颜料'],['黄麻纸','裁成长幅笺纸'],['镇纸','固定纸面'],['细毫笔','控制转折与收锋']],[['整纸','将笺纸置中，以镇纸压住上缘。'],['试笔','在余纸确认浓淡与笔锋。'],['循序','依示意自上而下完成线条。'],['收卷','待干后题签，收入符匣。']]),E('门楣小签','挂签练习 · 基础','适合门侧或案头陈设的小幅签样，以结构均衡和悬挂方式为主。','此为美术与手作示例，不替代任何现实安全措施。',[['熟宣小签','裁切圆角'],['墨色颜料','用于主线'],['棉绳','悬挂收束']],[['定幅','确认上下留白。'],['绘制','先外框后内纹。'],['穿绳','干燥后穿绳打结。']])]},incense:{title:'香 事',note:'读香谱、辨香材、看合香次序，再到炉前完成一炉小试。',entries:[E('清宁合香','香粉小试 · 入门','以温和木香和清凉草本构成的阁中示例，重点体验称量、研合与试闻流程。','网页配比为交互占位；现实制作前须另行核验原料安全、过敏与燃烧条件。',[['檀木粉','作为温润基底'],['艾草叶','少量草本气息'],['陈皮','干燥后研细'],['瓷钵','研合容器']],[['拣香','确认材料干燥洁净。'],['研末','分别研细，再过筛。'],['合香','由基底开始，少量加入辅香。'],['入炉','取少量隔火试闻，保持通风。']]),E('雨后书斋','气味构想 · 示例','以纸张、潮木与淡茶为意象的气味构想页，用于体验先定香意、再选材料。','当前为视觉与流程占位，不提供现实燃烧配方。',[['木香意象','沉静基调'],['茶香意象','清润中调'],['柑橘意象','轻亮前调']],[['定意','选择想呈现的空间。'],['择调','前、中、后调各取一种。'],['试闻','从低量开始调整。']])]},prayer:{title:'祝 文',note:'从场合、称谓、正文到落款，翻卷可读，入案可排。',entries:[E('新居祝笺','文式排布 · 示例','用于学习祝笺结构的版式示例：起首说明对象，正文表达祝愿，末尾落款。','言辞贵在真切，不必堆砌玄奥典故。',[['素笺','便于书写保存'],['墨锭','研墨书写'],['卷轴杆','完成后装卷']],[['定题','写明祝愿对象与场合。'],['拟文','用自己的话写三至五句。'],['誊清','确认无误后正式书写。'],['落款','记录日期与署名。']]),E('岁时小祝','节序文式 · 示例','按季节与节日整理简短祝语的册页，可用于案头陈设。','祝文内容由使用者自己填写。',[['折页册','可逐年增补'],['印泥','作为题签点色']],[['择时','确定节序。'],['成句','写下具体祝愿。'],['归册','按年份保存。']])]},vessel:{title:'器 物',note:'先读器形与用途，再识材料、装配和养护；器物以可用为先。',entries:[E('小型隔火香炉','器形认识 · 示例','认识炉身、承灰层与隔火片的关系，并以安全摆放为制作案重点。','涉及火源时须使用合格器具、耐热台面并保持照看。',[['耐热炉体','稳定且无裂纹'],['香灰','承托隔火片'],['云母片','用于隔火'],['炉箸','调整位置']],[['验器','检查炉体与台面。'],['铺灰','平整铺入承灰层。'],['置片','将隔火片置于中央。'],['试位','不点火演练取放顺序。']]),E('卷轴收纳匣','木作构想 · 示例','用于收纳祝文与小幅笺纸的长匣构想，第一版提供结构认识流程。','真实木作尺寸与连接方式待后续专业资料补齐。',[['木片','匣体结构'],['棉布','内衬保护'],['铜扣','闭合件']],[['量卷','先量收纳物尺寸。'],['定匣','预留衬布空间。'],['装衬','平整贴合内壁。']])]},books:{title:'典 籍',note:'总录与方法书函。由此回看五门索引，也可收藏常用册页。',entries:[E('天工阁总录','阁藏索引 · 第一卷','记录阁中五门内容的用途、来源状态与待核验事项。第一版用它说明信息组织方式。','后续真实内容应注明来源、版本、安全提示与核验状态。',[['索引签','对应五门柜藏'],['版本笺','记录修订日期'],['来源卡','标注资料来源']],[['录题','建立统一题名。'],['分门','归入最贴近的门类。'],['核验','记录来源与待确认项。'],['修订','保留版本变化。']]),E('材料辨识册','材料志 · 占位','未来用于查看材料外观、气味、用途、禁忌和保存方式；当前只呈现资料结构。','涉及接触、燃烧或摄入风险的材料，必须以可靠资料核验。',[['材料图','待接入批准素材'],['属性页','用途与保存'],['安全笺','风险与禁忌']],[['采集','记录稳定名称与图像。'],['核对','至少比对可靠来源。'],['入册','标明核验状态。']])]}};
function E(title,meta,intro,quote,materials,steps){return{title:title,meta:meta,intro:intro,quote:quote,materials:materials,steps:steps}}var keys=Object.keys(DATA),state={cat:'incense',entry:0,tab:'read',step:0,choice:0},$=function(id){return document.getElementById(id)},doors=$('doors'),records=$('records'),sheet=$('sheet'),matList=$('matList');function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function current(){return DATA[state.cat].entries[state.entry]}function renderDoors(){doors.innerHTML=keys.map(function(k){var d=DATA[k];return'<button class="door '+(k===state.cat?'active':'')+'" data-cat="'+k+'">'+ICONS[k]+'<b>'+d.title.replace(/ /g,'')+'</b><small>'+d.entries.length+' 卷在架</small></button>'}).join('')}function renderRecords(){var d=DATA[state.cat];$('catTitle').textContent=d.title;$('catNote').textContent=d.note;records.innerHTML=d.entries.map(function(e,i){return'<button class="record '+(i===state.entry?'active':'')+'" data-entry="'+i+'"><b>'+esc(e.title)+'</b><small>'+esc(e.meta)+'</small><i>›</i></button>'}).join('')}function renderMats(){matList.innerHTML=current().materials.map(function(m){return'<div class="mat">'+ICONS.tool+'<span>'+esc(m[0])+'</span></div>'}).join('')}function renderPage(){var e=current();$('seal').innerHTML=DATA[state.cat].title.replace(/ /g,'<br>');$('entryTitle').textContent=e.title;$('entryMeta').textContent=e.meta;$('pageTabs').innerHTML=[['read','阅 典'],['materials','识 材'],['steps','循 序']].map(function(t){return'<button class="page-tab '+(state.tab===t[0]?'active':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>'}).join('');if(state.tab==='read')sheet.innerHTML='<h3>册 页 小 引</h3><p>'+esc(e.intro)+'</p><div class="quote">'+esc(e.quote)+'</div>';if(state.tab==='materials')sheet.innerHTML='<h3>材料与器具</h3><div class="ingredient-list">'+e.materials.map(function(m){return'<div class="ingredient"><b>'+esc(m[0])+'</b><span>'+esc(m[1])+'</span></div>'}).join('')+'</div>';if(state.tab==='steps')sheet.innerHTML='<h3>制作次序</h3><div class="steps">'+e.steps.map(function(s){return'<div class="step"><div><b>'+esc(s[0])+'</b><span>'+esc(s[1])+'</span></div></div>'}).join('')+'</div>';renderMats()}function renderAll(){renderDoors();renderRecords();renderPage()}
doors.onclick=function(e){var b=e.target.closest('[data-cat]');if(!b)return;state.cat=b.dataset.cat;state.entry=0;state.tab='read';renderAll()};records.onclick=function(e){var b=e.target.closest('[data-entry]');if(!b)return;state.entry=+b.dataset.entry;state.tab='read';renderRecords();renderPage()};$('pageTabs').onclick=function(e){var b=e.target.closest('[data-tab]');if(!b)return;state.tab=b.dataset.tab;renderPage()};function benchStep(){var e=current(),s=e.steps[state.step],last=state.step===e.steps.length-1;$('benchTitle').textContent=e.title;$('benchProgress').innerHTML=e.steps.map(function(_,i){return'<i class="progress-dot '+(i<=state.step?'on':'')+'"></i>'}).join('');$('workIcon').innerHTML=ICONS[state.cat];$('workTitle').textContent=s[0];$('workText').textContent=s[1];$('choices').innerHTML=(state.step===0?e.materials.slice(0,3):[['依册完成','']]).map(function(m,i){return'<button class="choice '+(i===state.choice?'active':'')+'" data-choice="'+i+'">'+esc(m[0])+'</button>'}).join('');$('prevStep').disabled=state.step===0;$('nextStep').textContent=last?'完 成 收 案':'下 一 步'}function openBench(){state.step=0;state.choice=0;benchStep();$('benchMask').classList.add('open')}function closeBench(){$('benchMask').classList.remove('open')}$('makeBtn').onclick=openBench;$('benchClose').onclick=closeBench;$('benchMask').onclick=function(e){if(e.target===this)closeBench()};$('choices').onclick=function(e){var b=e.target.closest('[data-choice]');if(!b)return;state.choice=+b.dataset.choice;benchStep()};$('prevStep').onclick=function(){if(state.step){state.step--;state.choice=0;benchStep()}};$('nextStep').onclick=function(){var e=current();if(state.step<e.steps.length-1){state.step++;state.choice=0;benchStep()}else{closeBench();toast('已完成一轮案上试作 · 未保存为真实作品')}};var tt;function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(tt);tt=setTimeout(function(){$('toast').classList.remove('show')},2600)}document.addEventListener('keydown',function(e){if(e.key==='Escape')closeBench()});renderAll()})();
</script></body></html>
