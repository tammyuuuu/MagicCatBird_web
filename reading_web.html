});
captureOverlay.addEventListener('pointermove', (e) => {
  if (!_selStart) return;
  const x = Math.min(_selStart.x, e.clientX);
  const y = Math.min(_selStart.y, e.clientY);
  const w = Math.abs(e.clientX - _selStart.x);
  const h = Math.abs(e.clientY - _selStart.y);
  captureRect.style.left = x + 'px';
  captureRect.style.top  = y + 'px';
  captureRect.style.width  = w + 'px';
  captureRect.style.height = h + 'px';
});
captureOverlay.addEventListener('pointerup', (e) => {
  if (!_selStart) return;
  _selStart = null;
  const r = captureRect.getBoundingClientRect();
  if (r.width < 20 || r.height < 20) {
    captureRect.style.display = 'none';
    return;
  }
  captureTip.textContent = '已选择区域，点下方保存';
  captureConfirm.classList.add('show');
  captureCancel.classList.add('show');
});

captureCancel.addEventListener('click', () => {
  captureOverlay.classList.remove('active');
  captureRect.style.display = 'none';
  captureConfirm.classList.remove('show');
  captureCancel.classList.remove('show');
});

// 当页面以 file:// 打开时，本地图片会被浏览器视为跨域资源，html2canvas
// 生成的画布可能无法导出。此时改用浏览器原生的当前标签页捕获，再裁切选区。
async function captureSelectedAreaFromCurrentTab(rect) {
  if (!navigator.mediaDevices?.getDisplayMedia) {
    throw new Error('当前浏览器不支持画面捕获，请通过本地服务器打开页面');
  }
  const stream = await navigator.mediaDevices.getDisplayMedia({
    video: { displaySurface: 'browser' },
    audio: false,
    preferCurrentTab: true,
    selfBrowserSurface: 'include',
    surfaceSwitching: 'exclude'
  });
  const video = document.createElement('video');
  video.muted = true;
  video.playsInline = true;
  video.srcObject = stream;
  try {
    await video.play();
    if (!video.videoWidth || !video.videoHeight) {
      await new Promise(resolve => video.addEventListener('loadeddata', resolve, { once: true }));
    }
    // 捕获当前标签页时，视频尺寸与视口成比例；分别计算横纵缩放以兼容系统缩放。
    const scaleX = video.videoWidth / window.innerWidth;
    const scaleY = video.videoHeight / window.innerHeight;
    const frame = document.createElement('canvas');
    frame.width = video.videoWidth;
    frame.height = video.videoHeight;
    frame.getContext('2d').drawImage(video, 0, 0);
    const crop = document.createElement('canvas');
    crop.width = Math.max(1, Math.round(rect.width * scaleX));
    crop.height = Math.max(1, Math.round(rect.height * scaleY));
    crop.getContext('2d').drawImage(
      frame,
      Math.max(0, Math.round(rect.left * scaleX)),
      Math.max(0, Math.round(rect.top * scaleY)),
      crop.width, crop.height,
      0, 0, crop.width, crop.height
    );
    return crop;
  } finally {
    stream.getTracks().forEach(track => track.stop());
    video.srcObject = null;
  }
}

function compressCaptureCanvas(crop) {
  const maxW = 900;
  const sc = Math.min(1, maxW / crop.width);
  const small = document.createElement('canvas');
  small.width = Math.max(1, Math.round(crop.width * sc));
  small.height = Math.max(1, Math.round(crop.height * sc));
  small.getContext('2d').drawImage(crop, 0, 0, small.width, small.height);
  return small.toDataURL('image/jpeg', 0.85);
}

captureConfirm.addEventListener('click', async () => {
  const r = captureRect.getBoundingClientRect();
  captureOverlay.style.display = 'none';   // 截图时隐藏选区工具
  try {
    const canvas = await html2canvas(document.body, {
      backgroundColor: '#0d001a',
      scale: Math.min(window.devicePixelRatio || 2, 2),
      useCORS: true,
      logging: false,
    });
    const s = Math.min(window.devicePixelRatio || 2, 2);
    const sw = Math.max(1, Math.round(r.width * s));
    const sh = Math.max(1, Math.round(r.height * s));
    const sx = Math.max(0, Math.round(r.left * s));
    const sy = Math.max(0, Math.round(r.top * s));
    const crop = document.createElement('canvas');
    crop.width = sw; crop.height = sh;
    crop.getContext('2d').drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
    _captureDataUrl = compressCaptureCanvas(crop);
  } catch (err) {
    console.warn('页面截图导出失败，改用浏览器画面捕获', err);
    try {
      const nativeCrop = await captureSelectedAreaFromCurrentTab(r);
      _captureDataUrl = compressCaptureCanvas(nativeCrop);
    } catch (fallbackErr) {
      console.error('截图失败', fallbackErr);
      _captureDataUrl = null;
      captureTip.dataset.captureError = fallbackErr?.message || String(fallbackErr);
    }
  } finally {
    captureOverlay.style.display = '';
    captureOverlay.classList.remove('active');
    captureRect.style.display = 'none';
    captureConfirm.classList.remove('show');
    captureCancel.classList.remove('show');
  }
  if (_captureDataUrl) {
    openRecordPage(null);
  } else {
    const detail = captureTip.dataset.captureError;
    captureTip.textContent = detail ? `截图失败：${detail}` : '截图失败，请重试';
    delete captureTip.dataset.captureError;
    captureOverlay.classList.add('active');
  }
});

// —— 记录页 ——
function openRecordPage(record) {
  if (record) {
    _viewingRecordId = record.id;
    rpTitle.textContent = '✦ 记 录 详 情 ✦';
    rpPhoto.innerHTML = `<img src="${record.img}" alt="记录">`;
    rpQuestion.value = record.question || '';
    rpInterp.value = record.interp || '';
    rpSave.textContent = '更新';
    rpDelete.style.display = 'flex';
  } else {
    _viewingRecordId = null;
    rpTitle.textContent = '✦ 新 记 录 ✦';
    rpPhoto.innerHTML = _captureDataUrl ? `<img src="${_captureDataUrl}" alt="截图">` : '';
    rpQuestion.value = '';
    rpInterp.value = '';
    rpSave.textContent = '保存';
    rpDelete.style.display = 'none';
  }
  recordPage.classList.add('active');
}

function closeRecordPage() {
  recordPage.classList.remove('active');
  _captureDataUrl = null;
  _viewingRecordId = null;
}

rpSave.addEventListener('click', () => {
  const question = rpQuestion.value.trim();
  const interp = rpInterp.value.trim();
  const records = loadRecords();
  if (_viewingRecordId) {
    const idx = records.findIndex(r => r.id === _viewingRecordId);
    if (idx >= 0) {
      records[idx].question = question;
      records[idx].interp = interp;
      records[idx].ts = Date.now();
    }
  } else {
    if (!_captureDataUrl) { alert('请先截图再保存'); return; }
    records.unshift({
      id: 'rec_' + Date.now(),
      img: _captureDataUrl,
      question, interp, ts: Date.now(),
    });
  }
  persistRecords(records);
  renderRecords();
  closeRecordPage();
});

rpDelete.addEventListener('click', () => {
  if (!_viewingRecordId) return;
  if (!confirm('确定删除这条记录？')) return;
  const records = loadRecords().filter(r => r.id !== _viewingRecordId);
  persistRecords(records);
  renderRecords();
  closeRecordPage();
});

rpCancel.addEventListener('click', closeRecordPage);

// —— 记录抽屉渲染 ——
function renderRecords() {
  const grid = document.getElementById('recGrid');
  const records = loadRecords();
  if (!records.length) {
    grid.innerHTML = '<div class="record-empty">暂无记录<br>点击底部相机按钮记录解读</div>';
    return;
  }
  grid.innerHTML = records.map(r => `
    <div class="record-item" data-id="${r.id}">
      <img src="${r.img}" alt="记录">
      <div class="ri-info">
        <div class="ri-q">${r.question || '（无问题）'}</div>
        <div class="ri-date">${new Date(r.ts).toLocaleString()}</div>
      </div>
    </div>
  `).join('');
  grid.querySelectorAll('.record-item').forEach(item => {
    item.addEventListener('click', () => {
      const rec = loadRecords().find(x => x.id === item.dataset.id);
      if (rec) {
        drawerRec.classList.remove('open');
        openRecordPage(rec);
      }
    });
  });
}

const astroDiceToggle = document.getElementById('astroDiceToggle');
const astroDiceClose = document.getElementById('astroDiceClose');
const astroDicePanel = document.getElementById('astroDicePanel');

let astroDiceRolling = false;

// 视觉与投掷数据统一按：行星 → 星座 → 宫位。
const astroDiceRow = astroDicePanel.querySelector('.astro-dice-row');
['planet', 'zodiac', 'house'].forEach(kind => {

};
document.querySelectorAll('.astro-die').forEach(die => {

    die.querySelector(`.${className}`)?.setAttribute('points', points);
  });
  die.querySelector('.die-ridge-light')?.setAttribute('d', 'M20 40 50 19 80 40M22 10 50 3 78 10');
  die.querySelector('.die-ridge-dark')?.setAttribute('d', 'M80 40 69 76 31 76 20 40M28 94 50 99 72 94');
});

function setAstroDiceOnDesk(visible) {
  astroDicePanel.classList.toggle('open', visible);
  astroDicePanel.setAttribute('aria-hidden', String(!visible));
  astroDiceToggle.classList.toggle('active', visible);
  astroDiceToggle.title = visible ? '再次投掷占星骰子' : '投掷占星骰子';
  astroDiceToggle.setAttribute('aria-label', astroDiceToggle.title);
  astroDiceToggle.setAttribute('aria-expanded', String(visible));
  astroDiceClose.classList.toggle('visible', visible);
  astroDiceClose.setAttribute('aria-hidden', String(!visible));
  if (visible) allDrawers.forEach(drawer => drawer.classList.remove('open'));
}

function astroRandomIndex(length) {
  if (globalThis.crypto?.getRandomValues) {
    const value = new Uint32Array(1);
    globalThis.crypto.getRandomValues(value);
    return value[0] % length;
  }
  return Math.floor(Math.random() * length);
}

function animateAstroDie(die, values, finalValue, index) {
  return new Promise(resolve => {
    const throwX = [-310, -35, 300][index];
    const throwY = [105, -190, 85][index];
    const bounceX = [28, -18, -30][index];
    die.style.setProperty('--throw-x', `${throwX}px`);
    die.style.setProperty('--throw-y', `${throwY}px`);
    die.style.setProperty('--bounce-x', `${bounceX}px`);
    die.classList.remove('rolling');
    void die.offsetWidth;
    die.classList.add('rolling');
    const valueEl = die.querySelector('.die-value');
    const ticker = setInterval(() => {
      renderAstroValue(valueEl, values[astroRandomIndex(values.length)]);
    }, 65);
    setTimeout(() => {
      clearInterval(ticker);
      renderAstroValue(valueEl, finalValue);
      die.classList.remove('rolling');
      resolve();
    }, 920);
  });
}

async function rollAstroDice() {
  if (astroDiceRolling) return;
  astroDiceRolling = true;
  setAstroDiceOnDesk(true);
  const dice = [...astroDicePanel.querySelectorAll('.astro-die')];
  const results = astroDiceSets.map(values => values[astroRandomIndex(values.length)]);
  await Promise.all(dice.map((die, index) => animateAstroDie(die, astroDiceSets[index], results[index], index)));
  astroDiceRolling = false;
}

astroDiceToggle.addEventListener('click', rollAstroDice);
astroDiceClose.addEventListener('click', () => setAstroDiceOnDesk(false));
clearBtn.addEventListener('click', () => {
  if (!astroDiceRolling) setAstroDiceOnDesk(false);
});
